<!-- ============================= FIG: SCHEMA ============================= -->
<div class="fig" id="schema">
<svg width="1160" height="700" viewBox="0 0 1160 700">
  <rect x="20" y="20" width="520" height="300" rx="12" fill="#f7f5ff" stroke="#6c4df6" stroke-width="2"/>
  <text class="tb" x="44" y="56" fill="#6c4df6">server/data/ &#8212; the JSON "database"</text>
  <text class="ts" x="44" y="92" font-family="Consolas, monospace">data/</text>
  <text class="ts" x="74" y="124" font-family="Consolas, monospace">&#9500;&#9472; knowledge.json   &#8592; what the bot knows</text>
  <text class="ts" x="74" y="156" font-family="Consolas, monospace">&#9500;&#9472; leads.json       &#8592; questions it could not answer</text>
  <text class="ts" x="74" y="188" font-family="Consolas, monospace">&#9492;&#9472; messages.json    &#8592; contact form submissions</text>
  <text class="tss" x="44" y="232">Each file holds one JSON array. One array element = one record (one "row").</text>
  <text class="tss" x="44" y="258">The array index plays no part: every record carries its own numeric id.</text>
  <text class="tss" x="44" y="284">readData() parses the file, writeData() writes the whole array back.</text>

  <rect x="580" y="20" width="560" height="300" rx="12" fill="#15192e"/>

  <text class="tws" x="604" y="122" font-family="Consolas, monospace">   "id": 1763492881734,</text>
  <text class="tws" x="604" y="152" font-family="Consolas, monospace">   "q": "Do you offer home delivery?",</text>
  <text class="tws" x="604" y="182" font-family="Consolas, monospace">   "a": "Yes, we deliver across the city</text>

  <text class="tws" x="604" y="268" font-family="Consolas, monospace">}</text>
  <text class="tws" x="604" y="300" font-size="12.5">id comes from Date.now() &#8212; milliseconds since 1970, unique enough here</text>
